<p>new-evaluation works!</p>
<div class="container">
  <div class="card col-md-6 offset-3 mt-2">
    <div class="card-header">Add A Project</div>
    <div *ngIf="newEvaluationFormGroup" class="card-body">
      <form [formGroup]="newEvaluationFormGroup" (ngSubmit)="handleAddEvaluation()"  >
        <div class="mb-3">
          <label class="form-label">Performance technique : {{ sliderValue }} %</label>
<!--          <input type="number" formControlName="question1" class="form-control">-->
          <div class="slidecontainer">
            <input id="myRange" class="form-range slider" type="range" min="0" max="100"  step="5" formControlName="question1" (input)="updateValue($event)" />
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Maitrise des couts : {{ sliderValue2 }} % </label>
<!--          <input type="number" formControlName="question2" class="form-control">-->
          <div class="slidecontainer">
            <input id="myRange2" class="form-range slider" type="range" min="0" max="100"  step="5" formControlName="question2" (input)="updateValue2($event)" />
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Respect des delais : {{ sliderValue3 }} %</label>
<!--          <input type="number" formControlName="question3" class="form-control">-->
          <div class="slidecontainer">
            <input id="myRange3" class="form-range slider"  type="range" min="0" max="100" step="5" formControlName="question3" (input)="updateValue3($event)" />
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">resolution des problemes : {{ sliderValue4 }} %</label>
<!--          <input type="number" formControlName="question4" class="form-control">-->
          <div class="slidecontainer">
            <input id="myRange4" class="form-range slider" type="range" min="0" max="100"  step="5" formControlName="question4" (input)="updateValue4($event)" />
          </div>
        </div>
        <button [disabled]="!newEvaluationFormGroup.valid"  class="btn btn-info">Save</button>
      </form>
    </div>
  </div>
</div>
