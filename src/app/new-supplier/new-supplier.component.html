<div class="form-box mt-5">
  <h1></h1>
  <p>Veuillez Saisir Les Informations Du Fournisseur</p>
  <form [formGroup]="newSupplierFormGroup" (ngSubmit)="handleSaveSupplier()" >
    <div class="form-group">
      <label class="mb-3" for="name">Nom D'Entreprise : </label>
      <input class="form-control mb-4" id="name" type="text" name="Name" formControlName="name" >
    </div>
    <div class="form-group">
      <label for="description" class="mb-3">Description :  </label>
      <textarea class="form-control mb-4" id="description" name="description" formControlName="description"></textarea>
    </div>
    <button [disabled]="!newSupplierFormGroup.valid"  class="btn btn-success mt-1">Enregistrer</button>
</form>
</div>
