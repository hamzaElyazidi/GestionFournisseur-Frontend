<html data-bs-theme="light" lang="en" style="margin-top: -50px;">

<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no"/>
  <title>Table - Brand</title>
</head>
<ng-container *ngIf="managers | async as listmanagers ; else failureOrLoading">
  <body id="page-top"
        style="margin-right: 50px;margin-left: 50px;margin-bottom: -208px;padding-top: 0px;padding-bottom: 222px;">
  <div id="wrapper">
    <div id="content-wrapper" class="d-flex flex-column">
      <div id="content">
        <div class="container-fluid"
             style="padding-left: 50px;padding-right: 50px;padding-top: 0px;margin-top: 10px;margin-bottom: 50px;padding-bottom: 0px;">
          <h3 class="text-dark mb-4" style="padding-bottom: 0px;"><span
            style="color: rgb(78, 115, 223);">Chefs De Projet</span></h3>
          <div class="card shadow">
            <div class="card-header py-3">
              <p class="text-primary m-0 fw-bold">Informations des fournisseurs :</p>
            </div>
            <div class="card-body" style="padding-right: 80px;padding-left: 80px;margin-right: 0px;">
              <div class="row">
                <div class="col-md-6 col-lg-4">
                  <div *ngIf="searchFormGroup" id="dataTable_filter" class="text-md-end dataTables_filter"
                       style="margin-right: 10px; padding-right: 10px;">
                    <form [formGroup]="searchFormGroup" (ngSubmit)="handleSearchManagers()">
                      <div class="input-group">
                        <input class="form-control form-control-sm" type="search" aria-controls="dataTable"
                               placeholder="Search" formControlName="keyword" />
                        <button class="btn btn-primary py-0" type="submit">
                          <i class="bi bi-search"></i>
                        </button>
                      </div>
                    </form>
                  </div>
                </div>
                <!--                <div class="col" style="padding-right: 10px; margin-right: 0px;">-->
                <!--                  <button class="btn btn-primary py-0" type="button"><i class="bi bi-search"></i></button>-->
                <!--                </div>-->

              </div>


              <div id="dataTablediv" class="table-responsive table mt-2" role="grid" aria-describedby="dataTable_info">
                <table id="dataTable" class="table my-0">
                  <thead>
                  <tr>
                    <th>Nom</th>
                    <th>Poste</th>
                    <th style="padding-left: 0px;padding-right: 0px;">E-mail</th>
                  </tr>
                  </thead>
                  <tbody>
                  <tr *ngFor="let m of pagedManagers">
                    <!--                    (click)="handleGetSupplierDetails(s)"-->
                    <td>
                      <div >{{ m.first_name }}  {{ m.last_name }}</div>
                    </td>
                    <td>
                      <div >{{ m.job_title }}</div>
                    </td>
                    <td>
                      <div>{{ m.email }}</div>
                    </td>
                  </tr>
                  </tbody>
                  <tfoot>
                  <tr *ngIf="secService.hasRoleIn(['ADMIN'])">
                    <td class="centered">
                      <button class="button_plus" routerLink="/create-user"></button>
                    </td>
                  </tr>
                  </tfoot>
                </table>
              </div>
              <div class="row">
                <div class="col-md-6 align-self-center">
                  <p id="dataTable_info" class="dataTables_info" role="status" aria-live="polite">Page 1 of 2</p>
                </div>
                <div class="col-md-6">
                  <nav class="d-lg-flex justify-content-lg-end dataTables_paginate paging_simple_numbers">
                    <ul class="pagination">
                      <button class="button-like" [disabled]="currentPage == 0" (click)="previousPage()">
                        <li class="page-item disabled"><a class="page-link" aria-label="Previous"><span
                          aria-hidden="true">«</span></a></li>
                      </button>
                      <li class="page-item active"><a class="page-link">{{ currentPage + 1 }} of {{ maxPage + 1 }}</a>
                      </li>
                      <button class="button-like" [disabled]="currentPage >= maxPage" (click)="nextPage()">
                        <li class="page-item disabled"><a class="page-link" aria-label="Previous"><span
                          aria-hidden="true">»</span></a></li>
                      </button>
                    </ul>
                  </nav>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <a class="border rounded d-inline scroll-to-top" href="#page-top"><i class="fas fa-angle-up"></i></a>
  </div>
  </body>
</ng-container>
<ng-template #failureOrLoading>
  <ng-container *ngIf="errorMessage ; else loading">
    <div class="text-danger">
      {{ errorMessage }}
    </div>
  </ng-container>
  <ng-template #loading>
    Loading...........
  </ng-template>
</ng-template>
<ng-template #missingValue>
  <td>N/A</td>
</ng-template>
<ng-template #noProjects>
  <td>0</td>
</ng-template>
</html>
