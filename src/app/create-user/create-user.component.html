<div class="container">
  <div class="card col-md-6 offset-3 mt-2">
    <div class="card-header">Add A User</div>
    <div class="card-body">
      <form [formGroup]="newUserFormGroup" (ngSubmit)="handleCreateUser()"  >
        <div class="mb-3">
          <label class="form-label">nom d'utilisateur : </label>
          <input type="text" formControlName="username" class="form-control">
        </div>
        <div class="mb-3">
          <label class="form-label">mot de passe : </label>
          <input type="password" formControlName="password" class="form-control">
        </div>
        <div class="mb-3">
          <label class="form-label">prenom  : </label>
          <input type="text" formControlName="first_name" class="form-control">
        </div>
        <div class="mb-3">
          <label class="form-label">nom : </label>
          <input type="text" formControlName="last_name" class="form-control">
        </div>
        <div class="mb-3">
          <label class="form-label">poste : </label>
          <input type="text" formControlName="job_title" class="form-control">
        </div>
        <div class="mb-3">
          <label class="form-label">email : </label>
          <input type="text" formControlName="mail" class="form-control">
        </div>
        <button [disabled]="!newUserFormGroup.valid"  class="btn btn-info">Save</button>
      </form>
    </div>
  </div>
</div>
